name: CI

on: [push, pull_request]

jobs:
  tests:
    name: "Bitcoin-based-Pension-Savings-Vault"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
        
      - name: "Setup Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          
      - name: "Install dependencies"
        run: npm install
        
      - name: "Check contract syntax"
        uses: docker://hirosystems/clarinet:latest
        with:
          args: check
          
      - name: "Run unit tests"
        run: npm test